<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Gestión vehicular
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background-color: #f3f6fa;
            min-height: 100vh;
        }

        .navbar {
            background-color: #172554;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .main-container {
            padding-top: 35px;
            padding-bottom: 50px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
        }

        .stat-card {
            transition: transform .2s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .table thead th {
            background-color: #172554;
            color: white;
            border: none;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .btn {
            border-radius: 9px;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            min-height: 42px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'dashboard' %}"
        >
            <i class="bi bi-car-front-fill me-2"></i>
            Gestión Vehicular
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="menuPrincipal"
        >
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'dashboard' %}"
                    >
                        <i class="bi bi-speedometer2"></i>
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'lista' %}"
                    >
                        <i class="bi bi-list-ul"></i>
                        Vehículos
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'crear' %}"
                    >
                        <i class="bi bi-plus-circle"></i>
                        Registrar
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/admin/"
                    >
                        <i class="bi bi-person-gear"></i>
                        Administración
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<main class="container main-container">

    {% if messages %}
        {% for message in messages %}
            <div
                class="alert alert-success alert-dismissible fade show"
                role="alert"
            >
                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
